<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>個人事業主の税金シミュレーター</title>
<meta property="og:title" content="個人事業主の税金シミュレーター">
<meta property="og:description" content="所得税・住民税・事業税・予定納税・ふるさと納税上限額をかんたん計算（目安）">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;font-size:19px;line-height:1.7;background:#fff8ee;color:#222}
header{background:linear-gradient(135deg,#ff7a59,#ffb340);color:#fff;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:25px}header p{margin:4px 0 0;font-size:16px}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 3px 10px #0001;border-top:8px solid var(--c,#4a90e2)}
.card h2{margin:0 0 10px;font-size:22px;color:var(--c,#4a90e2)}
label{display:block;font-weight:bold;margin:12px 0 4px}
small,.note{font-size:15px;color:#666;font-weight:normal}
input,select{width:100%;font-size:20px;padding:10px;border:2px solid #ccc;border-radius:12px;background:#fffdf8}
input:focus,select:focus{border-color:#ff7a59;outline:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.dep{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end;margin-top:8px}
button{font-size:19px;padding:12px 18px;border:none;border-radius:14px;cursor:pointer;font-weight:bold}
.add{background:#4caf50;color:#fff}.del{background:#e57373;color:#fff;padding:10px 14px}
.big{display:block;width:100%;background:#ff7a59;color:#fff;font-size:23px;padding:16px;margin:16px 0}
table{width:100%;border-collapse:collapse;font-size:17px}td{padding:6px 4px;border-bottom:1px dashed #ddd;vertical-align:top}td.n{text-align:right;white-space:nowrap;font-weight:bold}
.f{font-size:15px;color:#555;background:#f3f7ff;border-radius:8px;padding:6px 8px;margin:4px 0 8px}
.total{font-size:26px;font-weight:bold;color:#d84315;text-align:center;margin:8px 0}
.furu{background:linear-gradient(135deg,#fff0f6,#ffe3ec)}
.furu .total{color:#c2185b;font-size:30px}
.warn{background:#fff3cd;border-radius:12px;padding:12px;font-size:16px}
details summary{cursor:pointer;font-weight:bold;color:#4a90e2}
</style></head><body>
<header><h1>💴 個人事業主の税金シミュレーター</h1><p>所得税・住民税・事業税・予定納税・ふるさと納税上限額（目安です）</p></header>
<main>
<div class="card" style="--c:#7e57c2"><h2>① 対象の年</h2>
<select id="year"><option value="8">令和8年分（2026年）</option><option value="7">令和7年分（2025年）</option></select>
<p class="note">基礎控除などは選んだ年の法律で計算します。</p></div>

<div class="card" style="--c:#1e88e5"><h2>② 所得（もうけ）</h2>
<label>事業所得 <small>（青色申告特別控除を引いた後の金額）</small></label><input id="biz" inputmode="numeric" placeholder="例 5000000">
<label>青色申告特別控除</label><select id="blue"><option value="650000">65万円</option><option value="550000">55万円</option><option value="100000">10万円</option><option value="0">なし（白色）</option></select>
<label>その他の所得 <small>（給与所得・年金の雑所得など、所得金額で）</small></label><input id="other" inputmode="numeric" placeholder="0">
<label>事業税の税率（業種）</label><select id="bizrate"><option value="0.05">5%（多くのサービス業・税理士など）</option><option value="0.04">4%（畜産・水産業など）</option><option value="0.03">3%（あんま・はり等）</option><option value="0">非課税の業種</option></select></div>

<div class="card" style="--c:#43a047"><h2>③ 家族</h2>
<label>本人の年齢</label><input id="age" inputmode="numeric" placeholder="65">
<label>配偶者</label><select id="sp"><option value="0">いない（控除なし）</option><option value="1">いる（70歳未満）</option><option value="2">いる（70歳以上）</option></select>
<label>配偶者の合計所得金額 <small>（パート年収なら給与所得に直して）</small></label><input id="spinc" inputmode="numeric" placeholder="0">
<label>扶養親族 <small>（配偶者以外）</small></label>
<div id="deps"></div><button class="add" type="button" onclick="addDep()">＋ 扶養親族を追加</button></div>

<div class="card" style="--c:#fb8c00"><h2>④ 控除（支払った金額）</h2>
<label>今年支払った社会保険料 <small>（国保・国民年金など。前年所得で決まるので実額を入力）</small></label><input id="si" inputmode="numeric" placeholder="0">
<label>小規模企業共済・iDeCo 掛金</label><input id="kyosai" inputmode="numeric" placeholder="0">
<div class="row"><div><label>生命保険料（新・一般）</label><input id="life1" inputmode="numeric" placeholder="0"></div><div><label>介護医療保険料</label><input id="life2" inputmode="numeric" placeholder="0"></div></div>
<div class="row"><div><label>個人年金保険料（新）</label><input id="life3" inputmode="numeric" placeholder="0"></div><div><label>地震保険料</label><input id="eq" inputmode="numeric" placeholder="0"></div></div>
<label>医療費 <small>（保険などで補てんされた分を引いた額）</small></label><input id="med" inputmode="numeric" placeholder="0">
<label>その他の所得控除 <small>（寡婦・障害者控除など、所得税の控除額）</small></label><input id="oth" inputmode="numeric" placeholder="0"></div>

<div class="card" style="--c:#3949ab"><h2>🏠 住宅ローン控除</h2>
<label>住宅ローン控除を使う</label><select id="hl"><option value="0">使わない</option><option value="1">使う</option></select>
<label>入居した年</label><select id="hly"><option value="8">令和8年〜（2026年〜）</option><option value="7">令和7年</option><option value="6">令和6年</option><option value="5">令和5年</option><option value="4">令和4年</option><option value="old">令和3年以前（控除額を手入力）</option></select>
<label>新築か中古か</label><select id="hln"><option value="new">新築・買取再販</option><option value="used">中古（既存住宅）</option></select>
<label>住宅の種類</label><select id="hlt"><option value="nin">認定長期優良・認定低炭素</option><option value="zeh">ZEH水準省エネ住宅</option><option value="sho">省エネ基準適合住宅</option><option value="etc">その他の住宅</option></select>
<label>子育て・若者夫婦世帯 <small>（19歳未満の扶養親族あり、または夫婦どちらかが40歳未満）※令和6年以降入居</small></label><select id="hlk"><option value="0">いいえ</option><option value="1">はい</option></select>
<label>床面積</label><select id="hlf"><option value="50">50㎡以上</option><option value="40">40㎡以上50㎡未満</option></select>
<label>年末のローン残高</label><input id="hlb" inputmode="numeric" placeholder="例 30000000">
<label>住宅の取得対価 <small>（任意。残高より少ない場合はこちらが上限）</small></label><input id="hlc" inputmode="numeric" placeholder="0">
<label>控除額を手入力 <small>（令和3年以前の入居や、証明書の金額を使う場合）</small></label><input id="hlm" inputmode="numeric" placeholder="空欄なら自動計算"></div>
<div class="card" style="--c:#8d6e63"><h2>⑤ 予定納税・源泉など</h2>
<label>前年分の所得税額 <small>（予定納税基準額：復興税込・源泉分除く）</small></label><input id="prev" inputmode="numeric" placeholder="0">
<label>今年の源泉徴収税額 <small>（報酬から引かれた分）</small></label><input id="gen" inputmode="numeric" placeholder="0">
<label>住民税 均等割 <small>（森林環境税1,000円を含む。市町村で異なります）</small></label><input id="kin" inputmode="numeric" value="5000">
<details style="margin-top:12px"><summary>国民健康保険の目安の設定（来年度分の参考）</summary>
<label>国保の加入人数</label><input id="kmem" inputmode="numeric" value="1">
<div class="row"><div><label>医療分 所得割率%</label><input id="r1" inputmode="decimal" value="7.5"></div><div><label>医療分 均等割/人</label><input id="e1" inputmode="numeric" value="30000"></div></div>
<div class="row"><div><label>支援分 所得割率%</label><input id="r2" inputmode="decimal" value="2.5"></div><div><label>支援分 均等割/人</label><input id="e2" inputmode="numeric" value="10000"></div></div>
<div class="row"><div><label>介護分 所得割率%（40〜64歳）</label><input id="r3" inputmode="decimal" value="2.0"></div><div><label>介護分 均等割/人</label><input id="e3" inputmode="numeric" value="12000"></div></div>
<p class="note">料率はお住まいの市区町村のものに直してください（初期値は仮の数字です）。</p></details></div>

<button class="big" type="button" onclick="calc()">🧮 計算する</button>
<div id="out"></div>
<div class="warn">⚠️ この計算は<b>目安です</b>。実際の税額は申告内容・市区町村・法改正により変わります。住民税の非課税判定、損益通算、税額控除（住宅ローン等）、配当・譲渡などの分離課税は含みません。</div>
</main>
<script>
const $=id=>document.getElementById(id);
const F=['year','biz','blue','other','bizrate','age','sp','spinc','si','kyosai','life1','life2','life3','eq','med','oth','prev','gen','kin','kmem','r1','e1','r2','e2','r3','e3','hl','hly','hln','hlt','hlk','hlf','hlb','hlc','hlm'];
const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';
const man=n=>(n/10000).toLocaleString('ja-JP')+'万円';
const num=id=>{const v=parseFloat(String($(id).value).replace(/[,，円\s]/g,''));return isNaN(v)?0:v};
function addDep(c='ippan',inc=''){const d=document.createElement('div');d.className='dep';
d.innerHTML='<div><select class="dc"><option value="ippan">一般（16〜18歳・23〜69歳）</option><option value="tokutei">特定（19〜22歳）</option><option value="rojin">老人（70歳以上）</option><option value="dokyo">同居老親（70歳以上の親・同居）</option></select></div><div><input class="di" inputmode="numeric" placeholder="所得 0"></div><button type="button" class="del">✕</button>';
d.querySelector('.dc').value=c;d.querySelector('.di').value=inc;d.querySelector('.del').onclick=()=>{d.remove();save()};
d.querySelectorAll('select,input').forEach(e=>e.addEventListener('change',save));$('deps').appendChild(d)}
function save(){try{const o={};F.forEach(k=>o[k]=$(k).value);o.deps=[...document.querySelectorAll('.dep')].map(d=>[d.querySelector('.dc').value,d.querySelector('.di').value]);localStorage.setItem('taxsim',JSON.stringify(o))}catch(e){}}
function load(){let o=null;try{o=JSON.parse(localStorage.getItem('taxsim')||'null')}catch(e){}
if(o){F.forEach(k=>{if(o[k]!=null)$(k).value=o[k]});(o.deps||[]).forEach(d=>addDep(d[0],d[1]))}}
// ---- law ----
function basicIT(T,y){const m=T/1e4;if(m>2500)return 0;if(m>2450)return 16e4;if(m>2400)return 32e4;if(m>2350)return 48e4;
if(y==8){if(m<=132)return 104e4;if(m<=655)return 67e4;return 62e4}
if(m<=132)return 95e4;if(m<=336)return 88e4;if(m<=489)return 68e4;if(m<=655)return 63e4;return 58e4}
function basicRT(T){const m=T/1e4;return m<=2400?43e4:m<=2450?29e4:m<=2500?15e4:0}
const SPB=[95,100,105,110,115,120,125,130,133];
const SPIT=[[38,36,31,26,21,16,11,6,3],[26,24,21,18,14,11,8,4,2],[13,12,11,9,7,6,4,2,1]];
const SPRT=[[33,33,31,26,21,16,11,6,3],[22,22,21,18,14,11,8,4,2],[11,11,11,9,7,6,4,2,1]];
function spouse(T,sp,si,y){const lim=y==8?62e4:58e4;if(sp==0||T>1000e4)return{it:0,rt:0,lab:'なし'};
const k=T<=900e4?0:T<=950e4?1:2;
if(si<=lim){const old=sp==2;const it=[[old?48:38],[old?32:26],[old?16:13]][k][0]*1e4,rt=[[old?38:33],[old?26:22],[old?13:11]][k][0]*1e4;return{it,rt,lab:'配偶者控除'+(old?'（老人）':''),diff:old?10e4:5e4}}
if(si>133e4)return{it:0,rt:0,lab:'配偶者の所得が133万円超のため対象外'};
const i=SPB.findIndex(b=>si<=b*1e4);return{it:SPIT[k][i]*1e4,rt:SPRT[k][i]*1e4,lab:'配偶者特別控除',diff:0}}
const TKIT=[[85,63],[90,61],[95,51],[100,41],[105,31],[110,21],[115,11],[120,6],[123,3]];
const TKRT=[[95,45],[100,41],[105,31],[110,21],[115,11],[120,6],[123,3]];
function dep(c,inc,y){const lim=y==8?62e4:58e4;const N={ippan:'一般',tokutei:'特定',rojin:'老人',dokyo:'同居老親'};
if(inc<=lim){const t={ippan:[38,33,5],tokutei:[63,45,18],rojin:[48,38,10],dokyo:[58,45,13]}[c];return{it:t[0]*1e4,rt:t[1]*1e4,diff:t[2]*1e4,lab:'扶養控除（'+N[c]+'）'}}
if(c=='tokutei'&&inc<=123e4){const a=TKIT.find(r=>inc<=r[0]*1e4)[1],b=TKRT.find(r=>inc<=r[0]*1e4)[1];return{it:a*1e4,rt:b*1e4,diff:0,lab:'特定親族特別控除'}}
return{it:0,rt:0,diff:0,lab:'所得が多いため対象外（'+N[c]+'）'}}
function loanLimit(y,n,t,k){// 万円
if(n=='new'){if(y==4||y==5)return {nin:5000,zeh:4500,sho:4000,etc:3000}[t];
const a={nin:[4500,5000],zeh:[3500,4500],sho:[3000,4000],etc:[0,0]};if(y>=8){a.sho=[2000,3000]}if(y==6||y==7||y>=8)return a[t][k?1:0]}
if(y>=8)return {nin:k?4500:3500,zeh:k?4500:3500,sho:k?3000:2000,etc:2000}[t];
return t=='etc'?2000:3000}
function lifeIT(p){return p<=2e4?p:p<=4e4?p/2+1e4:p<=8e4?p/4+2e4:4e4}
function lifeRT(p){return p<=12e3?p:p<=32e3?p/2+6e3:p<=56e3?p/4+14e3:28e3}
const RT=[[1949e3,.05,0],[3299e3,.10,97500],[6949e3,.20,427500],[8999e3,.23,636e3],[17999e3,.33,1536e3],[39999e3,.40,2796e3],[Infinity,.45,4796e3]];
function itRate(x){return RT.find(r=>x<=r[0])}
const fl=(x,u)=>Math.floor(Math.max(0,x)/u)*u;
function line(a,b,f){return `<tr><td>${a}${f?`<div class="f">${f}</div>`:''}</td><td class="n">${b}</td></tr>`}
function calc(){save();const y=+$('year').value;const biz=num('biz'),blue=+$('blue').value,other=num('other');
const T=biz+other;// 合計所得
const ded=[];let IT=0,RTd=0,diffSum=0;
const b1=basicIT(T,y),b2=basicRT(T);IT+=b1;RTd+=b2;diffSum+=(T<=2500e4?5e4:0);ded.push(['基礎控除',b1,b2]);
const s=spouse(T,+$('sp').value,num('spinc'),y);if(+$('sp').value){IT+=s.it;RTd+=s.rt;diffSum+=s.diff||0;ded.push([s.lab,s.it,s.rt])}
document.querySelectorAll('.dep').forEach(d=>{const r=dep(d.querySelector('.dc').value,parseFloat(d.querySelector('.di').value)||0,y);IT+=r.it;RTd+=r.rt;diffSum+=r.diff;ded.push([r.lab,r.it,r.rt])});
const si=num('si'),ky=num('kyosai');IT+=si+ky;RTd+=si+ky;ded.push(['社会保険料控除（入力値）',si,si]);if(ky)ded.push(['小規模企業共済等掛金控除',ky,ky]);
const l1=Math.min(12e4,lifeIT(num('life1'))+lifeIT(num('life2'))+lifeIT(num('life3'))),l2=Math.min(7e4,lifeRT(num('life1'))+lifeRT(num('life2'))+lifeRT(num('life3')));
if(l1){IT+=l1;RTd+=l2;ded.push(['生命保険料控除',l1,l2])}
const e1=Math.min(5e4,num('eq')),e2=Math.min(25e3,num('eq')/2);if(e1){IT+=e1;RTd+=e2;ded.push(['地震保険料控除',e1,e2])}
const md=Math.min(200e4,Math.max(0,num('med')-Math.min(10e4,T*.05)));if(md){IT+=md;RTd+=md;ded.push(['医療費控除（支払額−10万円または所得の5%）',md,md])}
const ot=num('oth');if(ot){IT+=ot;RTd+=ot;ded.push(['その他の所得控除',ot,ot])}
// 所得税
const ti=fl(T-IT,1000);const r=itRate(ti);const base0=Math.max(0,Math.floor(ti*r[1]-r[2]));
let hlAmt=0,hlF='',hlOk=true,hlMsg='',hlIT=0,hlRTcap=0,hlOld=false;
if($('hl').value=='1'){const hy=$('hly').value;hlOld=hy=='old';const manIn=num('hlm');const fa=+$('hlf').value;
if(T>(fa==40?1000e4:2000e4)){hlOk=false;hlMsg=`合計所得が${fa==40?'1,000':'2,000'}万円を超えるため、この年は住宅ローン控除を受けられません`}
else if(manIn>0||hlOld){hlAmt=manIn;hlF=`手入力の控除可能額 ${yen(manIn)}`}
else{const yy=+hy;const kid=$('hlk').value=='1'&&yy>=6&&fa==50;const lim=loanLimit(yy,$('hln').value,$('hlt').value,kid)*1e4;
let bal=num('hlb');const c=num('hlc');if(c>0)bal=Math.min(bal,c);
hlAmt=Math.floor(Math.min(bal,lim)*.007/100)*100;hlF=`min(年末残高 ${yen(bal)}, 借入限度額 ${man(lim)}${kid?'（子育て等上乗せ）':''}) × 0.7%`;
if(lim==0){hlMsg='その他の住宅（新築）は令和6年以降入居では原則対象外です（令和5年までに建築確認を受けたものは2,000万円）'}}
hlIT=Math.min(hlAmt,base0);hlRTcap=hlOld?Math.min(Math.floor(ti*.07),136500):Math.min(Math.floor(ti*.05),97500)}
const base=base0-hlIT;const fk=Math.floor(base*.021);const itTotal=base+fk;
const gen=num('gen');const prevTax=num('prev');const yotei=prevTax>=15e4?Math.floor(prevTax/3/100)*100:0;
const kakutei=Math.floor((itTotal-gen-yotei*2)/100)*100;
// 住民税
const tr=fl(T-RTd,1000);let adj=0,adjF='';if(T<=2500e4&&tr>0){if(tr<=200e4){adj=Math.min(diffSum,tr)*.05;adjF=`課税所得200万円以下：min(人的控除差 ${yen(diffSum)}, ${yen(tr)})×5%`}else{adj=Math.max((diffSum-(tr-200e4))*.05,2500);adjF=`{人的控除差 ${yen(diffSum)}−(${yen(tr)}−200万円)}×5%（最低2,500円）`}}
const shotokuwari=Math.max(0,Math.floor((tr*.10-adj)/100)*100);const hlRT=Math.min(Math.max(0,hlAmt-hlIT),hlRTcap,shotokuwari);const shoAfter=shotokuwari-hlRT;const kin=tr>0?num('kin'):0;const rtTotal=shoAfter+kin;
// 事業税
const br=+$('bizrate').value;const bb=fl(biz+blue-290e4,1000);const bt=Math.floor(bb*br/100)*100;
// 国保 目安
const age=num('age'),mem=Math.max(1,num('kmem'));const kb=Math.max(0,T-43e4);
let kk=Math.min(66e4,kb*num('r1')/100+num('e1')*mem)+Math.min(26e4,kb*num('r2')/100+num('e2')*mem);if(age>=40&&age<65)kk+=Math.min(17e4,kb*num('r3')/100+num('e3'));
// ふるさと
const fr=ti>0?r[1]:0;const furu=Math.floor(shotokuwari*.2/(.9-fr*1.021)+2000);
const total=itTotal+rtTotal+bt;
let h=`<div class="card" style="--c:#1e88e5"><h2>📋 所得と控除</h2><table>${line('合計所得金額',yen(T),`事業所得 ${yen(biz)} ＋ その他 ${yen(other)}`)}</table>
<table><tr><td><b>控除の内訳</b></td><td class="n">所得税</td><td class="n">住民税</td></tr>${ded.map(d=>`<tr><td>${d[0]}</td><td class="n">${yen(d[1])}</td><td class="n">${yen(d[2])}</td></tr>`).join('')}
<tr><td><b>所得控除 合計</b></td><td class="n">${yen(IT)}</td><td class="n">${yen(RTd)}</td></tr></table>
<p class="note">基礎控除は令和${y}年分の法律（合計所得に応じた段階制）で自動計算。住民税の基礎控除は43万円。</p></div>
